name: App Store

# Deliberately manual. The TestFlight workflow runs on every push; pushing
# metadata and submitting for review should always be a decision, never a
# side effect of a commit.
#
# action values:
#   screenshots_only  - reshoot screenshots, publish as an artifact to review
#   metadata_only     - push copy and screenshots, do not submit
#   submit_for_review - push and submit for review
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        default: screenshots_only
        type: choice
        options:
          - screenshots_only
          - metadata_only
          - submit_for_review

concurrency:
  group: appstore
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Pillow
        run: python3 -m pip install --break-system-packages --quiet Pillow

      - name: Regenerate screenshots on the latest iOS simulator
        run: bash scripts/screenshots.sh

      - name: Publish screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: fastlane/screenshots/zh-Hant/*.png

      - name: Push metadata and screenshots
        if: github.event.inputs.action == 'metadata_only'
        run: bundle exec fastlane metadata_only

      - name: Push metadata and submit for review
        if: github.event.inputs.action == 'submit_for_review'
        run: bundle exec fastlane release
