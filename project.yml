name: HKNewcomerGuide
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  HKNewcomerGuide:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
      - path: Resources/apps.json
        buildPhase: resources
      - path: Resources/personas.json
        buildPhase: resources
      - path: Resources/zh-Hant.lproj
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: 港來通
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.mengmusanqian.hknewcomerguide
        DEVELOPMENT_TEAM: "DDDFQ9Z58N"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: true
        # The device runs a much newer iOS than this Xcode's SDK. Xcode's Debug
        # "debug dylib" split leaves a stub executable that fails to load the
        # dylib there and launches to a black screen, so build one binary.
        ENABLE_DEBUG_DYLIB: NO
schemes:
  HKNewcomerGuide:
    build:
      targets:
        HKNewcomerGuide: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug
